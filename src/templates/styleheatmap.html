<div class="m-stylemanager-list-container m-stylemanager-hidden">
    <div class="title">{{translations.options}}</div>
    <br>
    <div class="m-stylemanager-group-row">
        <div class="m-stylemanager-style-col-1">{{translations.attribute}}</div>
        <div class="m-stylemanager-style-col-2">
            <select data-options="attributeName" class="m-stylemanager-style-select m-stylemanager-input-size">
                {{#each attributes}}
                <option value="{{this.name}}" {{#eq this.name this.selected}}selected{{/eq}}>{{this.name}}</option>
                {{/each}}
            </select>
        </div></div>
    <div class="m-stylemanager-group-row">
        <div class="m-stylemanager-style-col-1">
            <button data-add class="m-stylemanager-button-styles">{{translations.addColor}}</button>
        </div>
        <div class="m-stylemanager-style-col-2">{{translations.gradient}}
            <div class="m-stylemanager-grid" data-parent="gradient">
                {{#each gradient}}
                <div class="m-stylemanager-removable-input-color">
                    <input type="color" data-array-options="gradient" value="{{this}}">
                    <span class="m-stylemanager-close"></span>
                </div>
                {{/each}}
            </div>
        </div>
    </div>
    <div class="m-stylemanager-group-row">
        <div class="m-stylemanager-style-col-1">{{translations.blur}}</div>
        <div class="m-stylemanager-style-col-2">
            <input type="number" data-style-options="blur" min="1" value="{{blur}}"
                class="m-stylemanager-style-select m-stylemanager-input-size">
        </div>
    </div>
    <div class="m-stylemanager-group-row">
        <div class="m-stylemanager-style-col-1">{{translations.radius}}</div>
        <div class="m-stylemanager-style-col-2">
            <input type="number" data-style-options="radius" min="1" value="{{radius}}"
                class="m-stylemanager-style-select m-stylemanager-input-size">
        </div>
    </div>
</div>
